<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Room Party</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #000;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            padding: 1rem 2rem;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s;
            position: relative;
        }

        nav a:hover {
            color: #ff6b6b;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #ff6b6b;
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: #fff;
            transition: all 0.3s;
            border-radius: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        section {
            min-height: 100vh;
            padding: 100px 2rem 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        section h2 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        #video {
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
        }

        #discography {
            background: linear-gradient(135deg, #2d2d2d 0%, #1e1e1e 100%);
        }

        #about {
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
        }

        #live {
            background: linear-gradient(135deg, #2d2d2d 0%, #1e1e1e 100%);
        }

        .content-placeholder {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: #ccc;
            text-align: center;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
        }

        .discography-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .album-cover {
            display: block;
            width: 320px;
            height: 320px;
            transition: transform 0.3s, box-shadow 0.3s;
            border-radius: 10px;
            overflow: hidden;
        }

        .album-cover:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        footer {
            background: #000;
            color: #888;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .social-links a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            .hamburger {
                display: flex;
            }

            nav {
                position: fixed;
                top: 60px;
                right: -100%;
                flex-direction: column;
                background: rgba(0, 0, 0, 0.98);
                width: 100%;
                padding: 2rem;
                gap: 1.5rem;
                transition: right 0.3s;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }

            nav.active {
                right: 0;
            }

            nav a {
                font-size: 1.2rem;
            }

            section h2 {
                font-size: 2rem;
            }

            section {
                padding: 80px 1rem 30px;
            }

            .album-cover {
                width: 250px;
                height: 250px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.2rem;
            }

            section h2 {
                font-size: 1.5rem;
            }

            .social-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Single Room Party</div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <nav id="nav">
                <a href="#video">Video</a>
                <a href="#discography">Discography</a>
                <a href="#about">About</a>
                <a href="#live">Live</a>
            </nav>
        </div>
    </header>

    <section id="video">
        <h2>Video</h2>
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/8JmWjWl_EDM?si=Iu2_iHuIAPa2exQ9" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>

    <section id="discography">
        <h2>Discography</h2>
        <div class="discography-content">
            <a href="https://big-up.style/QvFrIe6ASY" target="_blank" class="album-cover">
                <img src="./ok.png" alt="Album Cover">
            </a>
        </div>
    </section>

    <section id="about">
        <h2>About</h2>
        <div class="content-placeholder">
            <p>ひとり遊び</p>
        </div>
    </section>

    <section id="live">
        <h2>Live</h2>
        <div class="content-placeholder">
            <p>ライブスケジュールやチケット情報をここに配置できます</p>
        </div>
    </section>

    <footer>
        <div class="social-links">
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://x.com" target="_blank">X (Twitter)</a>
            <a href="https://youtube.com" target="_blank">YouTube</a>
        </div>
        <p>© 2025 Single Room Party</p>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const nav = document.getElementById('nav');
        const navLinks = document.querySelectorAll('nav a');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            nav.classList.toggle('active');
        });

        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                nav.classList.remove('active');
            });
        });
    </script>
</body>
</html>
